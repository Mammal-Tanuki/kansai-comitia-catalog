<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg">
  <link rel="stylesheet" href="./style.css">
  <title>関西コミティア77 個人Webカタログ</title>
  <script defer src="./data/circles77.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
<header><div class="header-inner"><h1>関西コミティア77</h1><p>2026年10月18日（日）11:00〜15:00 · 京都パルスプラザ</p></div></header>
<main>
  <div class="filters">
    <input id="q" class="wide" type="search" placeholder="サークル名・配置・購入予定・メモを検索" aria-label="サークルを検索">
    <select id="view" aria-label="表示するサークル"><option value="all">全サークル</option><option value="check">チェックリスト</option></select>
    <select id="review" aria-label="確認状況"><option value="all">確認状況：すべて</option><option value="yes">確認済み</option><option value="no">未確認</option></select>
    <select id="linkFilter" class="wide" aria-label="リンクの調査状況"><option value="all">リンク：すべて</option><option value="any">リンク発見済み</option><option value="x">Xあり</option><option value="pixiv">pixivあり</option><option value="web">Webあり</option><option value="none">リンク未特定</option><option value="pending">追加確認・要確認あり</option></select>
  </div>
  <div class="toolbar">
    <button class="primary" id="syncBtn">カタログを更新</button>
    <button id="exportBtn">バックアップ保存</button>
    <button id="importBtn">バックアップ読込</button>
    <input id="importFile" type="file" accept="application/json" hidden>
    <button id="resetBtn">チェックを全初期化</button>
  </div>
  <div id="syncMeta" class="sync" role="status" aria-live="polite">カタログを読み込んでいます…</div>
  <div id="stats" class="stats" aria-label="カタログの件数"></div>
  <p class="legend">未発見＝調べた範囲で確認できず。要確認＝閲覧制限・同名候補など。確認待ち＝追加検索が未実施。アカウントが存在しないという意味ではありません。</p>
  <div class="result-meta"><span id="resultCount"></span><a href="https://www.k-comitia.com/list77/" target="_blank" rel="noopener noreferrer">公式一覧 ↗</a></div>
  <section id="list" aria-label="参加サークル"></section>
  <button id="moreBtn" class="more" hidden>続きを表示</button>
  <p class="small">色分け・確認済み・購入予定・予算・メモ・訪問済みはこの端末に保存されます。カタログを更新しても引き継ぎます。</p>
  <p class="small footer-links"><a href="./data/research77.csv" download>リンク調査表（CSV）</a><a href="./RESEARCH.md" target="_blank" rel="noopener">調査方法と確認範囲</a><span id="version"></span></p>
</main>
<noscript><p>このカタログを使うにはJavaScriptを有効にしてください。</p></noscript>
</body>
</html>
