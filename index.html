<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1115"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>関西コミティア 個人Webカタログ</title><style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#1d2230;--text:#f5f7fb;--muted:#9fa8bb;--line:#2b3240;--accent:#8bd3ff;--shadow:0 8px 24px rgba(0,0,0,.25)}*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:var(--text);font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif}header{position:sticky;top:0;z-index:20;padding:12px;background:rgba(11,13,18,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}header h1{max-width:980px;margin:auto;font-size:18px}main{max-width:980px;margin:auto;padding:10px 10px 40px}.toolbar,.filters{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0}.wide{grid-column:1/-1}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px}textarea{min-height:72px;resize:vertical}button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:9px 10px;box-shadow:var(--shadow)}button.primary{background:#163248;border-color:#305d7b}.stats{display:flex;gap:7px;overflow:auto;padding:3px 0 8px}.stat{white-space:nowrap;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--muted);font-size:12px}.sync{padding:8px 10px;border-radius:11px;background:#121721;border:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.5}.card{background:linear-gradient(180deg,#181c25,#141821);border:1px solid var(--line);border-radius:16px;padding:10px;margin:8px 0;box-shadow:var(--shadow)}.top{display:flex;gap:8px;align-items:flex-start}.space{min-width:58px;text-align:center;font-weight:900;background:#0f1620;border:1px solid #253041;border-radius:10px;padding:7px}.name{font-weight:900;font-size:16px;flex:1}.links{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.links a,.links span{display:flex;align-items:center;justify-content:center;min-height:40px;text-decoration:none;border:1px solid #273140;background:#101721;border-radius:10px;font-size:12px}.links .off{color:#626b78}.chips{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}.chip{box-shadow:none;border-radius:999px;padding:6px 9px;font-size:11px;opacity:.72}.chip.on{opacity:1;outline:2px solid #fff}.c-red{background:#6a2028}.c-orange{background:#6a421e}.c-yellow{background:#675f1d}.c-green{background:#1d5a39}.c-blue{background:#224e6d}.c-gray{background:#3b404a}.checks{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px}.fields{display:grid;grid-template-columns:1fr 110px;gap:6px;margin-top:8px}.fields textarea{grid-column:1/-1}.empty{text-align:center;color:var(--muted);padding:34px}.small{font-size:11px;color:var(--muted)}dialog{background:#20232a;color:var(--text);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:90vw}@media(min-width:760px){.toolbar{grid-template-columns:repeat(4,1fr)}.toolbar .wide{grid-column:auto}.filters{grid-template-columns:2fr 1fr 1fr}}</style></head><body>
<header><h1>関西コミティア 個人Webカタログ</h1></header><main>
<div class="filters"><input id="q" class="wide" type="search" placeholder="サークル名・配置・メモを検索"><select id="view"><option value="all">全サークル</option><option value="check">チェックリスト</option></select><select id="review"><option value="all">確認状況：すべて</option><option value="yes">確認済み</option><option value="no">未確認</option></select></div>
<div class="toolbar"><button class="primary" id="syncBtn">公式リスト同期</button><button id="exportBtn">バックアップ保存</button><label><button type="button" onclick="this.nextElementSibling.click()">バックアップ読込</button><input id="importFile" type="file" accept="application/json" hidden></label><button id="resetBtn">チェックを全初期化</button></div>
<div id="syncMeta" class="sync">未同期です。公式サークルリストを取得すると一覧を作成します。</div><div id="stats" class="stats"></div><section id="list"></section>
<p class="small">保存項目：色分け・確認済み・購入予定・予算・メモ・訪問済み。データはこのブラウザのlocalStorageに保存されます。</p></main>
<script>
const VERSION='2026-10-13-kc1';
const OFFICIAL='https://www.k-comitia.com/list77/';
const KEY='kansai_comitia_catalog_v1';
const PREF='kansai_comitia_catalog_prefs_v1';
const SYNC='kansai_comitia_catalog_sync_v1';
const colors=['red','orange','yellow','green','blue','gray'];
const colorLabel={red:'赤',orange:'橙',yellow:'黄',green:'緑',blue:'青',gray:'灰'};
let circles=load(KEY,[]),prefs=load(PREF,{q:'',view:'all',review:'all'}),syncInfo=load(SYNC,null);
function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}function save(){localStorage.setItem(KEY,JSON.stringify(circles));localStorage.setItem(PREF,JSON.stringify(prefs));if(syncInfo)localStorage.setItem(SYNC,JSON.stringify(syncInfo))}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function state(x={}){return {color:'gray',reviewed:false,item:'',budget:'',memo:'',visited:false,...x}}
function normSpace(s=''){return s.normalize('NFKC').replace(/[‐‑‒–—−]/g,'-').replace(/\s+/g,'').toUpperCase()}
function idOf(space,name){return normSpace(space)+'|'+name.trim()}
function parseMd(text){const out=[];const seen=new Set();for(const raw of text.split(/\r?\n/)){let line=raw.trim();if(!line)continue;line=line.replace(/^[-*+]\s+/,'');const m=line.match(/^(?:\[([^\]]+)\]\(([^)]+)\)|(.+?))（\s*([A-Za-zＡ-Ｚａ-ｚ]+\s*[-‐‑‒–—−]?\s*[0-9０-９]{1,3})\s*）(?:\s|$)/);if(!m)continue;const name=(m[1]||m[3]||'').trim();const space=normSpace(m[4]);if(!name||!space||seen.has(idOf(space,name)))continue;seen.add(idOf(space,name));const rest=line;let web='',pixiv='',x='';for(const mm of rest.matchAll(/\[[^\]]*\]\((https?:\/\/[^)]+)\)/g)){const u=mm[1];try{const h=new URL(u).hostname.toLowerCase();if(h.includes('pixiv.net'))pixiv ||= u;else if(h==='x.com'||h.endsWith('.x.com')||h==='twitter.com'||h.endsWith('.twitter.com'))x ||= u;else web ||= u}catch{}}out.push({id:idOf(space,name),space,name,web,pixiv,x,state:state()})}return out}
async function syncOfficial(){const b=document.getElementById('syncBtn');b.disabled=true;b.textContent='同期中…';meta('公式ページを取得しています…');try{const urls=['https://r.jina.ai/'+OFFICIAL,'https://r.jina.ai/http://www.k-comitia.com/list77/'];let txt='';let used='';for(const u of urls){try{const r=await fetch(u,{cache:'no-store',headers:{'X-Respond-With':'markdown','X-Retain-Links':'all','X-No-Cache':'true'}});if(r.ok){txt=await r.text();used=u;if(txt.length>100)break}}catch{}}if(!txt)throw new Error('公式ページを取得できませんでした');const fresh=parseMd(txt);if(!fresh.length)throw new Error('サークル一覧を解析できませんでした');const old=new Map(circles.map(c=>[c.id,c]));circles=fresh.map(c=>old.has(c.id)?{...c,state:state(old.get(c.id).state),web:c.web||old.get(c.id).web,pixiv:c.pixiv||old.get(c.id).pixiv,x:c.x||old.get(c.id).x}:c);syncInfo={at:new Date().toISOString(),count:circles.length,source:used};save();render();meta(`${circles.length}サークルを同期しました。`)}catch(e){meta('同期エラー：'+e.message)}finally{b.disabled=false;b.textContent='公式リスト同期'}}
function meta(t){document.getElementById('syncMeta').textContent=t}
function filtered(){const q=prefs.q.toLowerCase();return circles.filter(c=>{if(prefs.view==='check'&&c.state.color==='gray')return false;if(prefs.review==='yes'&&!c.state.reviewed)return false;if(prefs.review==='no'&&c.state.reviewed)return false;if(q&&!`${c.space} ${c.name} ${c.state.item} ${c.state.memo}`.toLowerCase().includes(q))return false;return true}).sort((a,b)=>a.space.localeCompare(b.space,'ja',{numeric:true}))}
function render(){document.getElementById('q').value=prefs.q;document.getElementById('view').value=prefs.view;document.getElementById('review').value=prefs.review;if(syncInfo)meta(`${syncInfo.count}サークル同期済み / ${new Date(syncInfo.at).toLocaleString('ja-JP')}`);const counts=Object.fromEntries(colors.map(k=>[k,circles.filter(c=>c.state.color===k).length]));document.getElementById('stats').innerHTML=`<span class="stat">全 ${circles.length}</span>${colors.map(k=>`<span class="stat">${colorLabel[k]} ${counts[k]}</span>`).join('')}<span class="stat">訪問済 ${circles.filter(c=>c.state.visited).length}</span>`;const arr=filtered();document.getElementById('list').innerHTML=arr.length?arr.map(card).join(''):'<div class="empty">表示するサークルがありません</div>'}
function link(u,label){return u?`<a href="${esc(u)}" target="_blank" rel="noopener">${label}</a>`:`<span class="off">${label}なし</span>`}
function card(c){return `<article class="card" data-id="${esc(c.id)}"><div class="top"><div class="space">${esc(c.space)}</div><div class="name">${esc(c.name)}</div></div><div class="links">${link(c.web,'Web')}${link(c.pixiv,'pixiv')}${link(c.x,'X')}</div><div class="chips">${colors.map(k=>`<button class="chip c-${k} ${c.state.color===k?'on':''}" data-color="${k}">${colorLabel[k]}</button>`).join('')}</div><div class="checks"><label><input type="checkbox" data-field="reviewed" ${c.state.reviewed?'checked':''}> 確認済み</label><label><input type="checkbox" data-field="visited" ${c.state.visited?'checked':''}> 訪問済み</label></div><div class="fields"><input data-field="item" value="${esc(c.state.item)}" placeholder="購入予定品"><input data-field="budget" value="${esc(c.state.budget)}" placeholder="予算"><textarea data-field="memo" placeholder="メモ">${esc(c.state.memo)}</textarea></div></article>`}
function update(id,fn){const c=circles.find(x=>x.id===id);if(!c)return;fn(c);save()}
document.addEventListener('click',e=>{const card=e.target.closest('.card');if(card&&e.target.dataset.color){update(card.dataset.id,c=>c.state.color=e.target.dataset.color);render()}});
document.addEventListener('change',e=>{const card=e.target.closest('.card');if(card&&e.target.dataset.field){const f=e.target.dataset.field;update(card.dataset.id,c=>c.state[f]=e.target.type==='checkbox'?e.target.checked:e.target.value);if(e.target.type==='checkbox')render()}});
document.addEventListener('input',e=>{const card=e.target.closest('.card');if(card&&e.target.dataset.field){update(card.dataset.id,c=>c.state[e.target.dataset.field]=e.target.value)}});
q.oninput=e=>{prefs.q=e.target.value;save();render()};view.onchange=e=>{prefs.view=e.target.value;save();render()};review.onchange=e=>{prefs.review=e.target.value;save();render()};syncBtn.onclick=syncOfficial;
exportBtn.onclick=()=>{const blob=new Blob([JSON.stringify({version:VERSION,circles,prefs,syncInfo},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kansai-comitia-catalog-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
importFile.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.circles))throw 0;circles=d.circles.map(c=>({...c,state:state(c.state)}));prefs={...prefs,...(d.prefs||{})};syncInfo=d.syncInfo||syncInfo;save();render()}catch{alert('バックアップを読み込めませんでした')}e.target.value=''};
resetBtn.onclick=()=>{if(!confirm('色・確認済み・購入予定・予算・メモ・訪問済みをすべて初期化しますか？'))return;circles=circles.map(c=>({...c,state:state()}));save();render()};
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
